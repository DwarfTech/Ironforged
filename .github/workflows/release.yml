name: Release

# When the version in Ironforged.toc (or this file) changes on main, build Ironforged.zip and
# publish it as a GitHub release tagged v<version>. Can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: [Ironforged.toc, .github/workflows/release.yml]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          v=$(sed -n 's/^## Version: *//p' Ironforged.toc | tr -d '\r')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build Ironforged.zip
        if: steps.version.outputs.exists == 'false'
        run: |
          mkdir -p build/Ironforged
          rsync -a --exclude .git --exclude .github --exclude tests --exclude build \
            --exclude .gitignore --exclude .pkgmeta ./ build/Ironforged/
          cd build && zip -qr ../Ironforged.zip Ironforged
      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" Ironforged.zip \
            --target "$GITHUB_SHA" \
            --title "Ironforged ${{ steps.version.outputs.version }}" \
            --notes "Download **Ironforged.zip** below, unzip it, and put the Ironforged folder in your World of Warcraft \`Interface/AddOns\` folder."
